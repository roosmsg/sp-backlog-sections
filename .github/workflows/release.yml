# Builds the plugin and attaches the ZIP to a GitHub release whenever a version
# tag (v1.2.0, …) is pushed. The tag must match src/manifest.json "version".
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test
        run: node test/run.js
      - name: Build
        run: node build.js
      - name: Check that the tag matches the manifest version
        run: |
          VERSION=$(node -p "require('./src/manifest.json').version")
          test "v$VERSION" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != manifest v$VERSION"; exit 1; }
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "Backlog Sections ${GITHUB_REF_NAME#v}" --generate-notes
